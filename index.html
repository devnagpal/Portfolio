<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Nagpal — Portfolio</title>
  <!-- Preconnect to speed up loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <!-- Import Inter with standard weights -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@300;400;500;600;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Pinned Viewport Scene (One Continuous Canvas) -->
  <div id="canvas-container"></div>

  <!-- Editorial Typography Overlay (Stage 1) -->
  <div id="hero-editorial" class="hero-editorial">
    <div class="hero-left">
      <span id="hero-greeting" class="hero-greeting"></span>
      <h1 id="hero-name" class="hero-name"></h1>
    </div>
    <div class="hero-right">
      <p id="hero-bio" class="hero-bio"></p>
    </div>
  </div>

  <!-- Scroll Content Flow -->
  <div id="scroll-content" class="scroll-content">
    <!-- Sequence scrubbing space -->
    <div class="sequence-scrub-space"></div>

    <!-- ABOUT Section (INFO Left • ABOUT Right) -->
    <section id="section-about" class="section-about">
      <div class="about-left">
        <p id="about-lead" class="about-lead"></p>
        <p id="about-sub" class="about-sub"></p>
      </div>
      <div class="about-right">
        <h2 id="about-heading" class="about-heading"></h2>
      </div>
    </section>

    <!-- PROJECTS Section (Centered Heading & Centered Cards) -->
    <section id="section-projects" class="section-projects">
      <div class="projects-header">
        <h2 id="projects-heading" class="projects-heading"></h2>
      </div>
      <div id="projects-grid" class="projects-grid"></div>
    </section>

    <!-- SKILLS Section (SKILLS left • skill collection right) -->
    <section id="section-skills" class="section-skills">
      <div class="skills-left">
        <h2 class="skills-heading" id="skills-heading">SKILLS</h2>
      </div>
      <div class="skills-right">
        <div class="skills-field" id="skills-field"></div>
      </div>
    </section>

    <!-- CONTACT Section -->
    <section id="section-contact" class="section-contact">
      <div class="contact-header">
        <h2 id="contact-heading" class="contact-heading"></h2>
      </div>
      <div id="contact-links" class="contact-links"></div>
    </section>

    <!-- QUOTE Section -->
    <section id="section-quote" class="section-quote">
      <div id="quote-container" class="quote-container"></div>
    </section>
  </div>

  <!-- STAGE 3 (Independent Scene Container) -->
  <section id="stage-3" class="stage-3">
    <div class="stage-3-backdrop"></div>
    <div id="stage-3-container" class="stage-3-container">
      
      <button id="stage3-back" class="stage3-back" aria-label="Reset conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>

      <div class="chat-wrapper">
        <div id="chat-header" class="chat-header">
          <h2 id="chat-greeting" class="chat-greeting"></h2>
          <p id="chat-sub" class="chat-sub"></p>
        </div>
        
        <div id="chat-suggested" class="chat-suggested"></div>
        
        <div id="chat-history" class="chat-history">
          <!-- Active conversation goes here dynamically -->
        </div>
        
        <div class="chat-input-wrapper">
          <input type="text" id="chat-input" class="chat-input" autocomplete="off" />
          <button id="chat-send" class="chat-send" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="./main.js"></script>
</body>

</html>
